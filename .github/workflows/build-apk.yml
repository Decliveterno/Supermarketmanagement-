name: Compilar APK Android

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v3

      - name: Descomprimir archivos de la app
        run: |
          mkdir -p www
          if [ -f "supermercado-manager-dist.zip" ]; then
            unzip -o supermercado-manager-dist.zip -d www/
          else
            echo "No se encontró el archivo zip"
          fi

      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v2

      - name: Instalar Cordova
        run: npm install -g cordova

      - name: Crear proyecto Cordova y compilar APK
        run: |
          cordova create app_build com.supermercado.manager "Supermercado Manager"
          rm -rf app_build/www
          cp -r www app_build/www
          cd app_build
          cordova platform add android
          cordova build android --verbose

      - name: Guardar APK listo para descargar
        uses: actions/upload-artifact@v3
        with:
          name: Supermercado-Manager-APK
          path: app_build/platforms/android/app/build/outputs/apk/debug/app-debug.apk
