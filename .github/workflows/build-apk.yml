name: Compilar APK Android

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Preparar código de la app
        run: |
          mkdir -p www
          if [ -f "supermercado-manager-dist.zip" ]; then
            unzip -o supermercado-manager-dist.zip -d www/
          fi

      - name: Instalar Cordova y compilar APK
        run: |
          npm install -g cordova
          cordova create app_build com.supermercado.manager "Supermercado Manager"
          rm -rf app_build/www
          mkdir -p app_build/www
          cp -r www/* app_build/www/
          cd app_build

          cat << 'EOF' > config.xml
          <?xml version='1.0' encoding='utf-8'?>
          <widget id="com.supermercado.manager" version="1.0.0" xmlns="http://www.w3.org/ns/widgets" xmlns:android="http://schemas.android.com/apk/res/android" xmlns:cdv="http://cordova.apache.org/ns/1.0">
              <name>Supermercado Manager</name>
              <description>Supermercado POS</description>
              <content src="index.html" />
              <access origin="*" />
              <allow-intent href="http://*/*" />
              <allow-intent href="https://*/*" />
              <config-file target="AndroidManifest.xml" parent="/*">
                  <uses-permission android:name="android.permission.CAMERA" />
                  <uses-feature android:name="android.hardware.camera" android:required="false" />
                  <uses-feature android:name="android.hardware.camera.autofocus" android:required="false" />
              </config-file>
          </widget>
          EOF

          cordova platform add android
          cordova plugin add cordova-plugin-camera
          cordova plugin add cordova-plugin-android-permissions
          cordova build android --debug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Supermercado-Manager-APK
          path: app_build/platforms/android/app/build/outputs/apk/debug/app-debug.apk
