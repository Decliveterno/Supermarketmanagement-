name: Compilar APK Android

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Preparar código de la app
        run: |
          mkdir -p www
          if [ -f "supermercado-manager-dist.zip" ]; then
            unzip -o supermercado-manager-dist.zip -d www/
          fi
          # Forzar apertura directa de cámara en selectores de archivos si existen
          find www/ -type f -name "*.html" -exec sed -i 's/accept="image\/\*"/accept="image\/\*" capture="environment"/g' {} +

      - name: Instalar Cordova y compilar APK
        run: |
          npm install -g cordova
          cordova create app_build com.supermercado.manager "Supermercado Manager"
          rm -rf app_build/www
          mkdir -p app_build/www
          cp -r www/* app_build/www/
          cd app_build
          cordova platform add android
          cordova plugin add cordova-plugin-camera
          cordova plugin add phonegap-plugin-barcodescanner
          cordova build android --debug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Supermercado-Manager-APK
          path: app_build/platforms/android/app/build/outputs/apk/debug/app-debug.apk
