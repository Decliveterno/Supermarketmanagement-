<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#059669" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#334155" stroke-width="4"/>

  <!-- Glowing Accent Shape -->
  <circle cx="256" cy="256" r="160" fill="url(#emeraldGrad)" opacity="0.12"/>

  <!-- Shopping Cart & Barcode Emblem -->
  <g filter="url(#shadow)" transform="translate(48, 48)">
    <!-- Cart Base -->
    <path d="M70 90 L120 90 L160 270 L320 270 L350 140 L130 140" 
          fill="none" stroke="url(#emeraldGrad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Wheels -->
    <circle cx="175" cy="325" r="24" fill="#34d399"/>
    <circle cx="305" cy="325" r="24" fill="#34d399"/>

    <!-- Barcode Inside Cart -->
    <rect x="180" y="170" width="12" height="65" rx="4" fill="#f8fafc"/>
    <rect x="202" y="170" width="6" height="65" rx="3" fill="#f8fafc"/>
    <rect x="218" y="170" width="18" height="65" rx="4" fill="#f8fafc"/>
    <rect x="246" y="170" width="8" height="65" rx="4" fill="#f8fafc"/>
    <rect x="264" y="170" width="16" height="65" rx="4" fill="#f8fafc"/>
    <rect x="290" y="170" width="10" height="65" rx="4" fill="#f8fafc"/>

    <!-- Badge / Checkmark -->
    <circle cx="330" cy="90" r="32" fill="#38bdf8"/>
    <path d="M318 90 L326 98 L342 82" fill="none" stroke="#0f172a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
